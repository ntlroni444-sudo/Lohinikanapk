# language: YAML, file: .github/workflows/web2apk-build.yml
name: Build Web2APK from ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-web2apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract web2apk source zip
        run: |
          mkdir -p web_source
          unzip -o web2apk_source.zip -d web_source
          echo "--- isi zip ---"
          ls -R web_source

      - name: Convert web assets to APK
        uses: darkshredder/web-to-app-action@main
        with:
          build-folder-path: "web_source"
          app-name: "Web2ApkApp"
          output-folder-path: "web_apk"

      - name: Upload Web2APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: web2apk-release
          path: web_apk/
          retention-days: 7
